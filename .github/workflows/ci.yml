name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Server code must never log to stdout (stdout carries the MCP protocol)
        run: "! grep -rn 'console.log(' src/"
      - run: npm test
      - run: npm run build
      - name: Bin fails fast without configuration
        run: |
          set +e
          out=$(node dist/index.js 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q AZURE_DEVOPS_URL
      - name: Package contents
        run: npm pack --dry-run
