name: Publish to npm

# Publishes with npm Trusted Publishing (OIDC): no npm token is stored in GitHub.
# npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions:
#   owner: arslanmusta, repository: azure-devops-attachment-mcp-server, workflow: publish.yml, environment: (empty)
#   Allowed actions: tick "npm publish" — only "npm stage publish" is allowed by default, and
#   without it the registry answers "403 OIDC permission denied for this action".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets the job request the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false # never reuse caches in release builds
      # Trusted publishing needs npm >= 11.5.1; Node 24 ships npm 11 but pin to the latest to be safe.
      - run: npm install -g npm@latest
      - run: npm --version
      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Provenance attestations are generated automatically when publishing through OIDC.
      - run: npm publish --access public
